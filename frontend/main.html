<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino</title>
    <!-- [IA] inicio · ia/2026-11-02_ashenkn_menu-lateral.md -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <!-- [IA] fin -->
</head>
 
<!-- CAMBIO 1: se quitó el degradado y se puso la imagen como único fondo, en todo el body -->
<body class="min-h-screen bg-[url('images/backgroundcasinoff2.png')] bg-cover bg-center bg-no-repeat bg-fixed text-white" style="font-family: sans-serif;">
 
    <!-- [IA] inicio · ia/2026-11-02_ashenkn_menu-lateral.md -->
    <div x-data="{ abierto: false }" class="flex">
 
        <aside class="bg-[#820000] p-3 min-h-screen flex flex-col">
            <button @click="abierto = !abierto" class="bg-[#a20e0e] hover:bg-[#FF8B8B] hover:text-black p-3 rounded w-full">☰</button>
 
            <a href="tokens.html" class="flex items-center gap-2 bg-[#a20e0e] hover:bg-[#FF8B8B] hover:text-black p-3 rounded mt-3">
                <img src="images/token-icon.png" alt="Fichas" class="w-8 h-8">
                <span x-show="abierto">Fichas</span>
            </a>
            <!-- [IA] fin -->
 
            <a href="config.html" class="flex items-center gap-2 bg-[#a20e0e] hover:bg-[#FF8B8B] hover:text-black p-3 rounded mt-3">
                <img src="images/config-icon.png" alt="Configuración" class="w-8 h-8">
                <span x-show="abierto">Configuración</span>
            </a>
        </aside>
 
        <!-- CAMBIO 2: se quitó bg-[url('images/backgroundcasinoff.png')] -->
        <div class="flex-1 p-5">
            <div class="flex justify-end items-center gap-4">
                <!-- CAMBIO 3: id="saldo" para que main.js muestre el dinero guardado; letra blanca -->
                <span id="saldo" class="text-white text-2xl font-bold">0 $</span>
                <a href="#">
                    <img src="images/profile-icon.png" alt="Perfil" class="w-12 h-12 rounded-full object-cover">
                </a>
            </div>
 
            <h1 class="text-[#FF8B8B] text-2xl font-bold mt-5 mb-6">Todos los juegos</h1>
 
            <!-- [IA] inicio · ia/2026-11-02_ashenkn_busqueda-filtros.md -->
            <div x-data="{
                busqueda: '',
                categoria: 'todos',
                orden: 'asc',
                dropdownAbierto: false,
                juegos: [
                    { id: 1, nombre: 'Tragamonedas', tipo: 'tragamonedas', icono: '🎰', esFavorito: false },
                    { id: 2, nombre: 'Ruleta', tipo: 'ruleta', icono: '🎲', esFavorito: false },
                    { id: 3, nombre: 'Blackjack', tipo: 'cartas', icono: '🃏', esFavorito: false }
                ],
                get juegosFiltrados() {
                    return this.juegos
                        .filter(juego => {
                            const coincideNombre = juego.nombre.toLowerCase().includes(this.busqueda.toLowerCase());
                            const coincideTipo = this.categoria === 'todos' || juego.tipo === this.categoria;
                            return coincideNombre && coincideTipo;
                        })
                        .sort((a, b) => {
                            if (this.orden === 'asc') return a.nombre.localeCompare(b.nombre);
                            return b.nombre.localeCompare(a.nombre);
                        });
                }
            }">
 
                <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-6">
 
                    <input
                        type="text"
                        x-model="busqueda"
                        placeholder="Buscar juego..."
                        class="w-full md:w-1/3 bg-[#a20e0e] border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-400 focus:outline-none focus:border-[#FF8B8B]">
 
                    <div class="flex gap-4 w-full md:w-auto justify-between md:justify-end">
 
                        <div class="relative w-1/2 md:w-48" @click.away="dropdownAbierto = false">
                            <button
                                @click="dropdownAbierto = !dropdownAbierto"
                                class="w-full bg-[#a20e0e] border border-white/10 rounded-lg px-4 py-2 text-white flex justify-between items-center hover:border-[#FF8B8B] transition">
                                <span x-text="categoria === 'todos' ? 'Categoría: Todas' : 'Categoría: ' + categoria.charAt(0).toUpperCase() + categoria.slice(1)"></span>
                                <span class="text-xs ml-2">▼</span>
                            </button>
 
                            <div
                                x-show="dropdownAbierto"
                                class="absolute left-0 mt-2 w-full bg-[#0D0C1E] border border-white/10 rounded-lg shadow-xl z-20 overflow-hidden py-1">
 
                                <button
                                    @click="categoria = 'todos'; dropdownAbierto = false"
                                    class="w-full text-left px-4 py-2 text-sm hover:bg-[#FF8B8B] hover:text-black transition"
                                    :class="categoria === 'todos' ? 'text-[#F0C32C] font-bold' : 'text-white'">
                                    Todas las categorías
                                </button>
 
                                <button
                                    @click="categoria = 'cartas'; dropdownAbierto = false"
                                    class="w-full text-left px-4 py-2 text-sm hover:bg-[#FF8B8B] hover:text-black transition"
                                    :class="categoria === 'cartas' ? 'text-[#F0C32C] font-bold' : 'text-white'">
                                    Cartas
                                </button>
 
                                <button
                                    @click="categoria = 'ruleta'; dropdownAbierto = false"
                                    class="w-full text-left px-4 py-2 text-sm hover:bg-[#FF8B8B] hover:text-black transition"
                                    :class="categoria === 'ruleta' ? 'text-[#F0C32C] font-bold' : 'text-white'">
                                    Ruleta
                                </button>
 
                                <button
                                    @click="categoria = 'tragamonedas'; dropdownAbierto = false"
                                    class="w-full text-left px-4 py-2 text-sm hover:bg-[#FF8B8B] hover:text-black transition"
                                    :class="categoria === 'tragamonedas' ? 'text-[#F0C32C] font-bold' : 'text-white'">
                                    Tragamonedas
                                </button>
                            </div>
                        </div>
 
                        <select
                            x-model="orden"
                            class="w-1/2 md:w-auto bg-[#a20e0e] border border-white/10 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-[#FF8B8B]">
                            <option value="asc">Nombre (A - Z)</option>
                            <option value="desc">Nombre (Z - A)</option>
                        </select>
                    </div>
 
                </div>
 
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    <template x-for="juego in juegosFiltrados" :key="juego.id">
                        <div class="relative group bg-[#a20e0e] border border-white/10 rounded-xl overflow-hidden hover:border-[#FF8B8B] transition cursor-pointer">
 
                            <button
                                @click.stop="juego.esFavorito = !juego.esFavorito"
                                class="absolute top-3 right-3 z-10 bg-[#820000]/80 p-2 rounded-full hover:scale-110 transition text-xl"
                                :class="juego.esFavorito ? 'text-[#F0C32C]' : 'text-gray-400 hover:text-white'">
                                ★
                            </button>
 
                            <a href="#" @click.prevent class="block p-4">
                                <div class="w-full h-40 bg-[#820000] rounded-lg flex items-center justify-center mb-3 group-hover:scale-105 transition">
                                    <span class="text-4xl" x-text="juego.icono"></span>
                                </div>
                                <h2 class="text-lg font-bold text-white group-hover:text-[#FF8B8B] transition" x-text="juego.nombre"></h2>
                            </a>
                        </div>
                    </template>
                </div>
 
            </div>
            <!-- [IA] fin -->
 
        </div>
 
    </div>
 
    <!-- CAMBIO 3: muestra el saldo guardado -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

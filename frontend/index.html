<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pagina">
 
    <!-- IMAGEN -->
    <section class="imagen">
      <img src="images/index-imagefr.png">
    </section>
 
    <!-- FORMULARIO -->
    <section class="panel">
      <form class="login" method="post" id="index-form">
        <h1>INICIAR SESIÓN</h1>
 
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username" required>
 
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
 
        <button type="submit" id="index-form-button" disabled>INICIAR SESIÓN</button>
 
        <section class="seccion-enlace">
        <h3> Si no tienes una cuenta </h3> <a href="register.html" class="enlace">!Registrate¡ </a>
        </section>
      </form>
    </section>
 
  </main>
  <script src="index.js"></script>
</body>
</html>

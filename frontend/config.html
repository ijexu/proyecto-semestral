<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONFIGURACIÓN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="configuration-menu">
    
        <nav class="buttons-menu"> 
            <button type="button" class="user" data-seccion="user-section"> USUARIO </button>
            <button type="button" class="general" data-seccion="general-section"> GENERAL</button>
            <a class="logout" href="index.html"> CERRAR SESIÓN</a>
        </nav>

        <main class="menu-section"> 
        <!-- SECCIONES-->
            <section class="user-section" id="user-section">
                <!------------------------------------- CAJA ARRIBA ------------------------------------->
                <div class="config-box-up">
                    <!----------------- CAJA ▟ ----------------->
                    <div class="config-box-up-left">
                        <h4> Usuario </h4>
                        <h3> <span id="user"></span> </h3>
                    </div>
                    <!----------------- CAJA ▙ ----------------->
                    <div class="config-box-up-right">

                    </div>
                </div>
                <!------------------------------------- CAJA ABAJO  ------------------------------------->
                <div class="config-box-down">
                    <h4> Nombre </h4>
                        <h3> <span id="name"></span> </h3>

                    <h4> Apellido</h4>
                        <h3> <span id="lastname"></span> </h3>

                    <h4> Correo </h4>
                        <h3> <span id="mail"></span> </h3>

                    <h4> Contraseña </h4>
                        <h3> <span id="password"></span> </h3>
                    </div>
                    
                
            </section>

            <section class="general-section oculto" id="general-section"> 
                <h1> GENERAL </h1>
            </section>
        </main>
    </div>

    <script src="config.js"></script>
</body>
</html>

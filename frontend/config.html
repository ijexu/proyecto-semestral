<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONFIGURACIÓN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="configuration-menu">
    
        <nav class="buttons-menu"> 
            <button type="button" class="user" data-seccion="user-section"> USUARIO </button>
            <button type="button" class="general" data-seccion="general-section"> GENERAL</button>
            <a class="logout" href="index.html"> CERRAR SESIÓN</a>
        </nav>

        <main class="menu-section"> 
        <!-- SECCIONES-->
            <section class="user-section" id="user-section">
                <!------------------------------------- CAJA ARRIBA ------------------------------------->
                <div class="config-box-up">
                    <!----------------- CAJA ▟ ----------------->
                    <div class="data-fila"> 
                    <div class="data">
                            <h4> Correo </h4>
                            <div class="data-info">
                                <h3> <span id="user"></span> </h3>
                                <button type="button" class="edit-button"> ✎ </button>
                            </div>
                        </div>
                </div>
                    <!----------------- CAJA ▙ ----------------->
                    <div class="config-box-up-right">
                        <img  class="profile-icon"  src="images/profile-icon.png">
                    </div>
                </div>
                <!------------------------------------- CAJA ABAJO  ------------------------------------->
                <div class="config-box-down">
                    <h2 class="data-title"> DATOS </h2>
                <!-- NOMBRE -->
                    <div class="data-fila">
                        <div class="data">
                            <h4> Nombre </h4>
                            <div class="data-info">
                                <h3> <span id="name"></span> </h3>
                                <button type="button" class="edit-button"> ✎ </button>
                            </div>
                        </div>

                    <div class="data">
                        <h4>Apellido</h4>
                        <div class="data-info">
                            <h3> <span id="lastname"></span></h3>
                            <button type="button" class="edit-button"> ✎ </button>
                        </div>
                    </div>
                </div>
                <!-- CORREO -->
                <div class="data-fila"> 
                    <div class="data">
                            <h4> Correo </h4>
                            <div class="data-info">
                                <h3> <span id="mail"></span> </h3>
                                <button type="button" class="edit-button"> ✎ </button>
                            </div>
                        </div>
                </div>
                <!-- CONTRASEÑA -->
                <div class="data-fila"> 
                    <div class="data">
                            <h4> Contraseña </h4>
                            <div class="data-info">
                                <h3> <span id="password"></span> </h3>
                                <button type="button" class="edit-button"> ✎ </button>
                                <button type="button" class="viewpassword-button"> 👁 </button>
                            </div>
                        </div>
                </div>
                <!-- NACIMIENTO -->
                 <div class="data-fila"> 
                    <div class="data">
                            <h4> Fecha de nacimiento </h4>
                            <div class="data-info">
                                <h3> <span id="birthdate"></span> </h3>
                            </div>
                        </div>
                </div>




                </div>

            </section>

            <section class="general-section oculto" id="general-section"> 
                <h1> GENERAL </h1>
            </section>
        </main>
    </div>

    <script src="config.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>REGISTRARSE</title>
</head>
<body>
    <main class="registro">
        <div class="pagina-registro"> 
            <form method="post" class="register"> 
                <h1> REGISTRARSE </h1>
                <fieldset>
                    <legend> Nombre </legend>
                    <input type="text" name="name" placeholder="Nombre" required>
                    <input type="text" name="lastname" placeholder="Apellido" required>
                </fieldset>
                <label for="username"> Nombre de usuario </label>
                <input type="text" name="username" placeholder="usuario" required id="username">
                <label for="mail"> Correo electronico </label>
                <input type="email" name="mail" placeholder="ejemplo@mail.com" required id="mail">
                <label for="birthdate"> Fecha de nacimiento </label>
                <input type="date" name="birthdate" id="birthdate" required id="birthday">
                <label for="password"> Contraseña </label>
                <input type="password" name="password" required id="password">
                <button type="submit">REGISTRARSE</button>

                 <section class="seccion-enlace">
                    <h3> Si ya tienes una cuenta </h3> <a href="index.html" class="enlace"> Inicia sesión </a>
                </section>
            </form>


        </div>
    </main>
            <script src="register.js"></script>
</body>
</html>

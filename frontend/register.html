<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/register.css">
    <title>REGISTRARSE</title>
</head>
<body>
    <main class="registro">
        <div class="pagina-registro"> 
            <form method="post" class="register" id="register-form"> 
                <h1> REGISTRARSE </h1>
                <fieldset>
                    <legend> Nombre </legend>
                    <input type="text" name="name" placeholder="Nombre" aria-label="Nombre" autocomplete="given-name" required id="name">
                    <input type="text" name="lastname" placeholder="Apellido" aria-label="Apellido" autocomplete="family-name" required id="lastname">
                </fieldset>
                <label for="username"> Nombre de usuario </label>
                <input type="text" name="username" placeholder="usuario" autocomplete="username" required id="username">
                <label for="mail"> Correo electrónico </label>
                <input type="email" name="mail" placeholder="ejemplo@mail.com" autocomplete="email" required id="mail">
                <label for="birthdate"> Fecha de nacimiento </label>
                <input type="date" name="birthdate" id="birthdate" autocomplete="bday" required>
                <label for="password"> Contraseña </label>
                <input type="password" name="password" autocomplete="new-password" minlength="4" required id="password">
                <button type="submit">REGISTRARSE</button>

                <div class="seccion-enlace">
                    <p>Si ya tienes una cuenta</p>
                    <a href="index.html" class="enlace">Inicia sesión</a>
                </div>
            </form>


        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
